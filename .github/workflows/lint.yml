name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: shellcheck
        run: shellcheck --severity=warning install.sh shell/*.sh bash/bashrc

      # The syntax steps check every file and name each one that fails.
      - name: bash syntax
        run: |
          status=0
          for f in install.sh shell/*.sh bash/bashrc; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      - name: zsh syntax
        run: |
          zsh --version
          status=0
          for f in shell/*.sh zsh/zshrc; do
            zsh -n "$f" || { echo "::error file=$f::zsh -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      # Loads the shared config in zsh and checks `up` leaves $PATH alone
      # (zsh ties the `path` variable to $PATH).
      - name: zsh smoke test
        if: ${{ !cancelled() }}
        run: |
          zsh -c '
            DOTFILES=$PWD
            . shell/common.sh
            before=$PATH
            cd /tmp && up 1 || { echo "up failed"; exit 1; }
            [ "$PATH" = "$before" ] || { echo "up changed PATH to: $PATH"; exit 1; }
            dothelp >/dev/null || { echo "dothelp failed"; exit 1; }
          '
