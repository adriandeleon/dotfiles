name: lint

# Pull requests are checked on their own; pushes only on main, so a PR branch
# isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: shellcheck
        run: shellcheck --severity=warning install.sh shell/*.sh bash/bashrc tests/bash-test.sh

      # The syntax steps check every file and name each one that fails.
      - name: bash syntax
        run: |
          status=0
          for f in install.sh shell/*.sh bash/bashrc tests/bash-test.sh; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      - name: zsh syntax
        run: |
          zsh --version
          status=0
          for f in shell/*.sh zsh/zshrc tests/zsh-test.zsh; do
            zsh -n "$f" || { echo "::error file=$f::zsh -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      # install.sh --link in throwaway HOMEs, plus an interactive bash on top of
      # the stock ~/.bashrc. Never installs packages.
      - name: install + bash tests
        if: ${{ !cancelled() }}
        run: ./tests/bash-test.sh

      - name: zsh tests
        if: ${{ !cancelled() }}
        run: zsh tests/zsh-test.zsh
