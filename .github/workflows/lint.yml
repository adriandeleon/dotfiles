name: lint

# Pull requests are checked on their own; pushes only on main, so a PR branch
# isn't checked twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: shellcheck
        run: shellcheck --severity=warning install.sh shell/*.sh bash/bashrc tests/bash-test.sh

      # The syntax steps check every file and name each one that fails.
      - name: bash syntax
        run: |
          status=0
          for f in install.sh shell/*.sh bash/bashrc tests/bash-test.sh; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      - name: zsh syntax
        run: |
          zsh --version
          status=0
          for f in shell/*.sh zsh/zshrc tests/zsh-test.zsh; do
            zsh -n "$f" || { echo "::error file=$f::zsh -n failed (exit $?)"; status=1; }
          done
          exit "$status"

      # The real frameworks, so the load-order checks run against them too.
      - name: Fetch Oh My Bash / Oh My Zsh
        if: ${{ !cancelled() }}
        run: |
          git clone --depth=1 https://github.com/ohmybash/oh-my-bash.git "$RUNNER_TEMP/oh-my-bash"
          git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$RUNNER_TEMP/oh-my-zsh"

      # install.sh --link in throwaway HOMEs, plus interactive bash sessions on
      # top of the stock ~/.bashrc. Never installs packages.
      - name: install + bash tests
        if: ${{ !cancelled() }}
        run: OMB_SRC="$RUNNER_TEMP/oh-my-bash" ./tests/bash-test.sh

      - name: zsh tests
        if: ${{ !cancelled() }}
        run: OMZ_SRC="$RUNNER_TEMP/oh-my-zsh" zsh tests/zsh-test.zsh

  # macOS: install.sh under the system /bin/bash 3.2 with BSD awk/sed/readlink,
  # writing ~/.zshrc, then zsh sessions with and without the real Oh My Zsh.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: install.sh syntax under /bin/bash 3.2
        run: /bin/bash --version | head -1 && /bin/bash -n install.sh

      - name: Fetch Oh My Zsh
        run: git clone --depth=1 https://github.com/ohmyzsh/ohmyzsh.git "$RUNNER_TEMP/oh-my-zsh"

      - name: install + zsh tests
        run: OMZ_SRC="$RUNNER_TEMP/oh-my-zsh" zsh tests/zsh-test.zsh
